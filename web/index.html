<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Todo Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="dist/output.css" />
    <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
  </head>

  <body
    class="bg-gray-50 text-gray-800 dark:bg-darker dark:text-gray-200 h-screen overflow-hidden flex flex-col"
  >
    <nav
      class="bg-white dark:bg-dark border-b border-gray-200 dark:border-gray-800 shrink-0 relative z-20"
    >
      <div class="max-w-full px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
          <div class="flex">
            <button
              type="button"
              id="sidebarToggle"
              class="cursor-pointer space-y-1.5 px-4 border-r border-gray-200 dark:border-gray-700 text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-primary"
            >
              <span
                class="block w-6 h-0.5 bg-gray-800 transition-transform duration-300 dark:bg-white"
              ></span>
              <span
                class="block w-6 h-0.5 bg-gray-800 transition-opacity duration-300 dark:bg-white"
              ></span>
              <span
                class="block w-6 h-0.5 bg-gray-800 transition-transform duration-300 dark:bg-white"
              ></span>
            </button>
            <div class="flex-shrink-0 flex items-center px-4">
              <i
                class="ph ph-check-square-offset text-primary text-3xl mr-2"
              ></i>
              <span class="font-bold text-xl tracking-tight hidden sm:block"
                >TaskMaster</span
              >
            </div>
          </div>

          <div class="flex items-center space-x-4">
            <!-- Search Bar -->
            <div class="relative hidden sm:block">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                <i class="ph ph-magnifying-glass text-gray-400"></i>
              </span>
              <input
                type="text"
                class="block w-full rounded-full border-0 py-1.5 pl-10 pr-4 text-gray-900 dark:text-white dark:bg-gray-800 ring-1 ring-inset ring-gray-300 dark:ring-gray-700 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6"
                placeholder="Search tasks..."
              />
            </div>

            <!-- Theme Toggle -->
            <button
              id="themeToggle"
              class="p-2 text-gray-500 hover:text-primary dark:text-gray-400 dark:hover:text-primary rounded-full focus:outline-none"
            >
              <i class="ph ph-moon text-xl block dark:hidden" id="moonIcon"></i>
              <i class="ph ph-sun text-xl hidden dark:block" id="sunIcon"></i>
            </button>

            <!-- Notifications -->
            <button
              class="p-2 text-gray-500 hover:text-primary dark:text-gray-400 dark:hover:text-primary rounded-full relative"
            >
              <i class="ph ph-bell text-xl"></i>
              <span
                class="absolute top-1 right-1 block h-2 w-2 rounded-full bg-red-500 ring-2 ring-white dark:ring-dark"
              ></span>
            </button>

            <!-- User Profile Dropdown Toggle -->
            <div class="relative ml-3">
              <div>
                <button
                  type="button"
                  class="flex rounded-full bg-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-gray-800"
                  id="user-menu-button"
                  aria-expanded="false"
                  aria-haspopup="true"
                >
                  <span class="sr-only">Open user menu</span>
                  <img
                    class="h-8 w-8 rounded-full object-cover"
                    src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80"
                    alt="User Avatar"
                  />
                </button>
              </div>
              <!-- Profile Dropdown Menu (Hidden by default) -->
              <div
                id="user-menu"
                class="hidden absolute right-0 z-50 mt-2 w-48 origin-top-right rounded-md bg-white dark:bg-gray-800 py-1 shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none"
                role="menu"
                aria-orientation="vertical"
                tabindex="-1"
              >
                <div
                  class="px-4 py-2 border-b border-gray-100 dark:border-gray-700"
                >
                  <p class="text-sm font-medium text-gray-900 dark:text-white">
                    Alex Johnson
                  </p>
                  <p class="text-xs text-gray-500 dark:text-gray-400 truncate">
                    alex@example.com
                  </p>
                </div>
                <a
                  href="#"
                  class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700"
                  role="menuitem"
                  >Your Profile</a
                >
                <a
                  href="#"
                  class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700"
                  role="menuitem"
                  >Settings</a
                >
                <a
                  href="#"
                  class="block px-4 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-gray-100 dark:hover:bg-gray-700"
                  role="menuitem"
                  >Sign out</a
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <div class="flex-1 flex overflow-hidden">
      <!-- Sidebar backdrop for mobile -->
      <div
        id="sidebarBackdrop"
        class="fixed inset-0 bg-gray-900/80 z-30 hidden lg:hidden transition-opacity cursor-pointer"
      ></div>

      <!-- Sidebar -->
      <aside
        id="sidebar"
        class="bg-white dark:bg-dark border-r border-gray-200 dark:border-gray-800 w-64 flex-shrink-0 flex flex-col absolute inset-y-0 left-0 transform -translate-x-full transition-all duration-300 ease-in-out z-40 lg:relative h-full overflow-hidden"
      >
        <div class="flex-1 overflow-y-auto pt-5 pb-4">
          <nav class="mt-5 px-3 space-y-1">
            <!-- Filters/Categories in Sidebar -->
            <p
              class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2"
            >
              Filters
            </p>

            <a
              href="#"
              class="bg-gray-100 dark:bg-gray-800 text-primary dark:text-primary group flex items-center px-3 py-2 text-sm font-medium rounded-md"
            >
              <i class="ph ph-tray text-lg mr-3"></i>
              All
              <span
                class="ml-auto bg-gray-200 dark:bg-gray-700 text-gray-900 dark:text-white py-0.5 px-2 rounded-full text-xs"
                >5</span
              >
            </a>

            <a
              href="#"
              class="text-gray-600 hover:bg-gray-50 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-gray-800 dark:hover:text-white group flex items-center px-3 py-2 text-sm font-medium rounded-md"
            >
              <i
                class="ph ph-calendar-star text-lg mr-3 text-gray-400 group-hover:text-gray-500 dark:group-hover:text-gray-300"
              ></i>
              Today
            </a>

            <a
              href="#"
              class="text-gray-600 hover:bg-gray-50 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-gray-800 dark:hover:text-white group flex items-center px-3 py-2 text-sm font-medium rounded-md"
            >
              <i
                class="ph ph-calendar-blank text-lg mr-3 text-gray-400 group-hover:text-gray-500 dark:group-hover:text-gray-300"
              ></i>
              Upcoming
            </a>

            <a
              href="#"
              class="text-gray-600 hover:bg-gray-50 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-gray-800 dark:hover:text-white group flex items-center px-3 py-2 text-sm font-medium rounded-md"
            >
              <i
                class="ph ph-warning-circle text-lg mr-3 text-red-400 group-hover:text-red-500"
              ></i>
              Important
            </a>
            <p
              class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mt-8 mb-2"
            >
              Projects / Categories
            </p>
            <div id="categoryContainer">
            <a
              href="#"
              class="text-gray-600 hover:bg-gray-50 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-gray-800 dark:hover:text-white group flex items-center px-3 py-2 text-sm font-medium rounded-md"
            >
              <span class="w-3 h-3 rounded-full bg-blue-500 mr-4"></span>
              Work
            </a>

            <a
              href="#"
              class="text-gray-600 hover:bg-gray-50 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-gray-800 dark:hover:text-white group flex items-center px-3 py-2 text-sm font-medium rounded-md"
            >
              <span class="w-3 h-3 rounded-full bg-green-500 mr-4"></span>
              Personal
            </a>

            <a
              href="#"
              class="text-gray-600 hover:bg-gray-50 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-gray-800 dark:hover:text-white group flex items-center px-3 py-2 text-sm font-medium rounded-md"
            >
              <span class="w-3 h-3 rounded-full bg-purple-500 mr-4"></span>
              Shopping
            </a>
            </div>

            <div class="flex justify-center">
              <button id="categoryBtn"
              class="mt-2 text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 flex items-center py-2 text-sm font-medium text-left"
              >
              <i class="ph ph-plus text-lg mr-3"></i>
              </button>
              <input id="categoryInput" type="text" class="mt-2 text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 flex items-center py-1 text-sm font-medium w-full text-left" placeholder="Enter Category">
            </div>
          </nav>
        </div>
        <!-- Bottom Sidebar Settings -->
        <div
          class="flex-shrink-0 flex border-t border-gray-200 dark:border-gray-800 p-4"
        >
          <a href="#" class="flex-shrink-0 w-full group block">
            <div
              class="flex items-center text-gray-500 hover:text-gray-900 dark:hover:text-white"
            >
              <i class="ph ph-gear text-xl"></i>
              <span class="ml-3 text-sm font-medium">Settings</span>
            </div>
          </a>
        </div>
      </aside>

      <main
        class="flex-1 overflow-y-auto bg-gray-50 dark:bg-darker focus:outline-none"
        tabindex="0"
      >
        <div class="max-w-4xl mx-auto px-4 sm:px-6 md:px-8 py-8">
          <div
            class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-8"
          >
            <div>
              <h1 class="text-2xl font-bold text-gray-900 dark:text-white">
                All Tasks
              </h1>
            </div>
            <div class="mt-4 sm:mt-0 flex gap-2">
              <!-- Sort Dropdown -->
              <div class="relative inline-block text-left">
                <button
                  type="button"
                  class="inline-flex justify-center w-full rounded-md border border-gray-300 dark:border-gray-700 shadow-sm px-4 py-2 bg-white dark:bg-gray-800 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary"
                  id="sort-menu-button"
                >
                  <i class="ph ph-faders mr-2 text-lg"></i>
                  Sort
                </button>
              </div>

              <button
                onclick="
                  document
                    .getElementById('addTaskModal')
                    .classList.remove('hidden')
                "
                class="inline-flex items-center px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-primary hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary"
              >
                <i class="ph ph-plus mr-2 text-lg"></i>
                Add Task
              </button>
            </div>
          </div>

          <div class="flex gap-2 mb-6 overflow-x-auto pb-2 scrollbar-hide">
            <span
              class="inline-flex items-center rounded-full bg-blue-100 dark:bg-blue-900/30 px-3 py-0.5 text-sm font-medium text-blue-800 dark:text-blue-300"
            >
              Category: Work
              <button
                type="button"
                class="ml-1.5 inline-flex h-4 w-4 flex-shrink-0 items-center justify-center rounded-full text-blue-400 hover:bg-blue-200 hover:text-blue-500 focus:bg-blue-500 focus:text-white focus:outline-none"
              >
                <i class="ph ph-x"></i>
              </button>
            </span>
            <span
              class="inline-flex items-center rounded-full bg-red-100 dark:bg-red-900/30 px-3 py-0.5 text-sm font-medium text-red-800 dark:text-red-300"
            >
              Priority: High
              <button
                type="button"
                class="ml-1.5 inline-flex h-4 w-4 flex-shrink-0 items-center justify-center rounded-full text-red-400 hover:bg-red-200 hover:text-red-500 focus:bg-red-500 focus:text-white focus:outline-none"
              >
                <i class="ph ph-x"></i>
              </button>
            </span>
          </div>

          <div class="">
            <ul
              role="list"
              id="taskList"
              class="divide-y divide-gray-200 dark:divide-gray-700"
            >
              <!-- Tasks will be dynamically added here -->
            </ul>
          </div>
          <div class="mt-8">
            <button
              id="toggleCompleted"
              class="flex w-full items-center justify-between rounded-lg bg-gray-100 dark:bg-gray-800 px-4 py-3"
            >
              <div class="flex items-center gap-2">
                <i
                  id="completedArrow"
                  class="ph ph-caret-down transition-transform"
                >
                </i>

                <span class="font-medium"> Completed </span>

                <span
                  class="badge rounded-full bg-gray-300 dark:bg-gray-700 px-2 text-xs"
                >
                  
                </span>
              </div>
            </button>

            <ul id="completedList" class="mt-3 space-y-2">
              <!-- Completed list will render dynamically -->
            </ul>
          </div>
        </div>
      </main>
    </div>

    <div
      id="addTaskModal"
      class="hidden relative z-[60]"
      aria-labelledby="modal-title"
      role="dialog"
      aria-modal="true"
    >
      <!-- Background backdrop -->
      <div
        id="modalBackdrop"
        class="fixed inset-0 bg-gray-900/80 transition-opacity cursor-pointer"
      ></div>

      <div class="fixed inset-0 z-10 overflow-y-auto">
        <div
          class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0"
        >
          <!-- Modal panel -->
          <div
            class="relative transform overflow-hidden rounded-lg bg-white dark:bg-dark text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg border border-gray-200 dark:border-gray-700"
          >
            <div class="px-4 pb-4 pt-5 sm:p-6 sm:pb-4">
              <div class="sm:flex sm:items-start">
                <div
                  class="mt-3 text-center sm:ml-4 sm:mt-0 sm:text-left w-full"
                >
                  <h3
                    class="text-lg font-semibold leading-6 text-gray-900 dark:text-white"
                    id="modal-title"
                  >
                    Create New Task
                  </h3>

                  <form class="mt-4 space-y-4" id="taskForm">
                    <!-- Title -->
                    <div>
                      <label for="title" class="sr-only">Task Title</label>
                      <input
                        type="text"
                        name="title"
                        id="title"
                        class="block w-full rounded-md py-2 text-gray-900 dark:text-white dark:bg-gray-800 shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-gray-700 placeholder:text-gray-400 sm:text-sm sm:leading-6"
                        placeholder="What needs to be done?"
                      />
                      <span
                        class="error-msg text-red-600 font-extralight text-sm"
                      ></span>
                    </div>

                    <!-- Grid for Filters (Date, Category, Priority) -->
                    <div
                      class="grid grid-cols-1 gap-x-4 gap-y-4 sm:grid-cols-2"
                    >
                      <!-- Due Date -->
                      <div>
                        <label
                          for="date"
                          class="block text-sm font-medium leading-6 text-gray-900 dark:text-gray-200"
                          >Due Date</label
                        >
                        <div class="relative mt-1">
                          <input
                            type="date"
                            id="date"
                            name="date"
                            class="block w-full rounded-md border-0 py-1.5 text-gray-900 dark:text-white dark:bg-gray-800 shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-gray-700 focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6 custom-date-input"
                          />
                          <span
                            class="error-msg text-red-600 font-extralight text-sm"
                          ></span>
                        </div>
                      </div>

                      <!-- Priority -->
                      <div>
                        <label
                          for="priority"
                          class="block text-sm font-medium leading-6 text-gray-900 dark:text-gray-200"
                          >Priority</label
                        >
                        <select
                          id="priority"
                          name="priority"
                          class="mt-1 block w-full rounded-md border-0 py-1.5 pl-3 pr-10 text-gray-900 dark:text-white dark:bg-gray-800 ring-1 ring-inset ring-gray-300 dark:ring-gray-700 focus:ring-2 focus:ring-primary sm:text-sm sm:leading-6"
                        >
                          <option value="low">Low</option>
                          <option value="medium">Medium</option>
                          <option value="high">High</option>
                        </select>
                        <span
                          class="error-msg text-red-600 font-extralight text-sm"
                        ></span>
                      </div>

                      <!-- Category -->
                      <div class="sm:col-span-2">
                        <label
                          for="category"
                          class="block text-sm font-medium leading-6 text-gray-900 dark:text-gray-200"
                          >Category / Project</label
                        >
                        <select
                          id="category"
                          name="category"
                          class="mt-1 block w-full rounded-md border-0 py-1.5 pl-3 pr-10 text-gray-900 dark:text-white dark:bg-gray-800 ring-1 ring-inset ring-gray-300 dark:ring-gray-700 focus:ring-2 focus:ring-primary sm:text-sm sm:leading-6"
                        >
                          <option value="work">Work</option>
                          <option value="personal">Personal</option>
                          <option value="shopping">Shopping</option>
                        </select>
                        <span
                          class="error-msg text-red-600 font-extralight text-sm"
                        ></span>
                      </div>
                    </div>
                  </form>
                </div>
              </div>
            </div>
            <!-- Modal Actions -->
            <div
              class="bg-gray-50 dark:bg-gray-800/50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6 border-t border-gray-200 dark:border-gray-700"
            >
              <button
                type="submit"
                form="taskForm"
                id="saveTaskBtn"
                class="inline-flex w-full justify-center rounded-md bg-primary px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 sm:ml-3 sm:w-auto"
              >
                Save Task
              </button>
              <button
                type="button"
                id="cancelTaskBtn"
                class="mt-3 inline-flex w-full justify-center rounded-md bg-white dark:bg-gray-700 px-3 py-2 text-sm font-semibold text-gray-900 dark:text-gray-200 shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-gray-600 hover:bg-gray-50 dark:hover:bg-gray-600 sm:mt-0 sm:w-auto"
              >
                Cancel
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script type="module" src="src/main.js"></script>
</html>
